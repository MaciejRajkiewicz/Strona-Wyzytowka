    <link rel="stylesheet" href="Footer.css">
    <link rel="stylesheet" href="Footer_interactive_files/Footer_interactive_css.css">
</head>
<body>
    <header>
        <a href="index.html"><img src="img_header/logo.png" alt="Logo_header" class="logo_header"></a>
        <div class="dropdown">
            <button class="menu_header">☰</button>
            <div class="menu_header_content">
                <a href="index.html">Strona główna</a>
                <a href="Footer_interactive.html">Gracze Steam</a>
                <a href="Kolko_i_krzyrzyk/index_kk.html">Kółko i Krzyrzyk</a>
                <a href="index2.html">Piłka nożna</a>
            </div>
        </div>
    </header>

    <main>
        <h2>Liczba graczy na żywo</h2>
        <p class="stats-intro">Aktualna liczba graczy w wybranych grach na Steam</p>

        <ul class="stats-list">
            <li>
                <span class="game-name">CS2</span>
                <span id="cs2-players">Ładowanie...</span>
            </li>
            <li>
                <span class="game-name">GTA 5</span>
                <span id="gta5-players">Ładowanie...</span>
            </li>
            <li>
                <span class="game-name">PAYDAY 2</span>
                <span id="payday2-players">Ładowanie...</span>
            </li>
            <li>
                <span class="game-name">Garry's Mod</span>
                <span id="gmod-players">Ładowanie...</span>
            </li>
            <li>
                <span class="game-name">Football Manager</span>
                <span id="fm-players">Ładowanie...</span>
            </li>
        </ul>
    </main>

    <footer>
        <div class="footer_left">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3mlLdjGKICpKkmrjEWxocQK8MmhrF-Cj7SNig2U4_sQ&s=10" alt="logo" id="img_smaller">
        </div>
        <div id="footer_right">
            <div id="column_1">
                <label for="column_1">
                    <span class="footer_title">Gry</span>
                    <ul>
                        <li><a href="https://www.roblox.com/games/91445552037955/HUSH">HUSH</a></li>
                        <li><a href="https://www.roblox.com/games/21532277/Notoriety-A-PAYDAY-Experience">PAYDAY</a></li>
                        <li><a href="https://www.roblox.com/games/9192423027/Industrialist">Industrialist</a></li>
                        <li><a href="https://www.roblox.com/games/185655149/Welcome-to-Bloxburg">Bloxburg</a></li>
                    </ul>
                </label>
            </div>
            <div id="column_2">
                <label for="column_2">
                    <span class="footer_title">Poradniki</span>
                <ul>
                    <li><a href="https://hush.fandom.com/wiki/H.U.S.H_Wiki">HUSH Wiki</a></li>
                    <li><a href="https://payday.fandom.com/wiki/PAYDAY_2">PAYDAY Wiki</a></li>
                    <li><a href="https://industrialist.fandom.com/wiki/Industrialist_Wiki">Industrialist Wiki</a></li>
                    <li><a href="https://tiny.pl/kvvr_0mm7">Bloxburg Wiki</a></li>
                </ul>
                </label>

            </div>
            <div id="column_3">
                <label for="column_3">
                    <span class="footer_title">Inne Platformy</span>
                <ul>
                    <li><a href="https://store.steampowered.com/">Steam</a></li>
                    <li><a href="https://store.epicgames.com/?lang=pl">Epic</a></li>
                    <li><a href="https://www.gog.com/pl/">GOG</a></li>
                    <li><a href="https://www.rockstargames.com/">Rockstar</a></li>
                </ul>
                </label>

            </div>

        </div>
    </footer>

    <script>
    (function () {
        const elementy = {
            cs2: document.getElementById("cs2-players"),
            gta5: document.getElementById("gta5-players"),
            payday2: document.getElementById("payday2-players"),
            gmod: document.getElementById("gmod-players"),
            fm: document.getElementById("fm-players")
        };

        function formatuj(liczba) {
            if (typeof liczba !== "number" || isNaN(liczba)) {
                return "Brak danych";
            }
            return liczba.toLocaleString("pl-PL") + " graczy";
        }

        const url = "Footer_interactive_files/Footer_interactive_dane.json?t=" + Date.now();

        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error("HTTP " + response.status);
                return response.json();
            })
            .then(data => {
                for (const klucz in elementy) {
                    if (elementy[klucz]) {
                        elementy[klucz].textContent = formatuj(data[klucz]);
                    }
                }
            })
            .catch(error => {
                console.error("Błąd wczytywania danych:", error);
                for (const klucz in elementy) {
                    if (elementy[klucz]) {
                        elementy[klucz].textContent = "Błąd ładowania";
                    }
                }
            });
    })();
    </script>
</body>
</html>
